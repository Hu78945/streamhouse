name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
      - name: Cache Spark/Iceberg jars (resolved by spark.jars.packages)
        uses: actions/cache@v4
        with:
          path: .tools/ivy2
          key: ivy-${{ hashFiles('src/streamhouse/spark.py') }}
      - name: Install (Python 3.11, dev + airflow groups)
        run: uv sync --all-groups --python 3.11
      - name: Lint + tests (Spark/Iceberg, streaming, Kafka mock cluster, S3 via moto, Airflow DAG import)
        run: make test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: make tf
