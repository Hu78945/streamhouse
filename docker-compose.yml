# Local stack: Kafka (KRaft, no ZooKeeper) + MinIO (S3) + the Spark streaming job.
#   docker compose up -d kafka minio minio-init
#   docker compose run --rm app streamhouse produce
#   docker compose up app            # bronze/silver/gold streaming queries, Iceberg tables on MinIO
# NOTE: written for, but not run on, the machine this project was built on (no Docker daemon there).
# The same topology was exercised natively instead: see "Measured results" in the README.
x-lake-env: &lake-env
  KAFKA_BOOTSTRAP: kafka:19092
  ICEBERG_WAREHOUSE: s3://lake/warehouse
  ICEBERG_CATALOG_URI: jdbc:h2:file:/state/catalog;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE
  CHECKPOINT_DIR: /state/checkpoints
  S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_REGION: us-east-1

services:
  kafka:
    image: apache/kafka:4.1.2
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:  # the minio image ships the mc client
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["sh", "-c", "mc alias set lake http://minio:9000 minioadmin minioadmin && mc mb -p lake/lake"]

  app:
    build: .
    command: ["streamhouse", "stream"]
    environment: *lake-env
    volumes: ["state:/state"]
    depends_on:
      kafka: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

volumes:
  state:
